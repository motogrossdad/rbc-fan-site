<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Depth Checkout</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a single fixed viewport with CSS perspective. Each checkout step is a "gate" placed deeper on the Z axis;
   the camera flies forward through them. A canvas behind draws the tunnel (floor grid, string-light portals, drifting lights). */
:root{
  --night:#0d0b22; --night-2:#1a1640; --ink:#f3effd; --muted:#a49ecf;
  --lamp:#ffb547; --lamp-soft:rgba(255,181,71,.13); --teal:#46e2c8; --rose:#ff7a98;
  --line:rgba(243,239,253,.15); --card:rgba(26,22,64,.80);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
#viewport{position:fixed;inset:0;overflow:hidden;perspective:1000px}
.stage{position:absolute;left:50%;top:calc(50% - 30px);width:min(860px,calc(100vw - 32px));max-height:calc(100dvh - 210px);overflow:auto;
  padding:4px 2px;transform-origin:50% 50%;will-change:transform,opacity;scrollbar-width:thin}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp);margin:0 0 6px}
.stage h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(2.3rem,6.4vw,4.4rem);
  line-height:.92;letter-spacing:.01em;margin:0 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 22px;max-width:60ch}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* intro */
.intro{text-align:center;padding-block:20px}
.intro h1{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(3.4rem,13vw,8.5rem);line-height:.84;margin:6px 0 14px;
  color:var(--ink);text-shadow:0 0 28px rgba(255,181,71,.45),0 0 2px var(--lamp)}
.intro h1 span{color:var(--lamp)}
.intro p{color:var(--muted);margin:0 auto 26px;max-width:46ch}
.hours{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:18px;letter-spacing:.04em}

/* tiles */
.grid{display:grid;gap:10px}
.dates{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.slots{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
.packs{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);transition:border-color .15s,background .15s,transform .15s,box-shadow .15s;min-width:0}
.tile:hover:not(:disabled){border-color:rgba(255,181,71,.55);transform:translateY(-2px)}
.tile[aria-pressed="true"]{border-color:var(--lamp);background:linear-gradient(180deg,rgba(255,181,71,.2),rgba(26,22,64,.85));
  box-shadow:0 0 0 1px var(--lamp),0 10px 34px -10px rgba(255,181,71,.55)}
.tile:disabled{opacity:.38;cursor:not-allowed}
.d-wd{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.d-num{font-family:var(--f-display);font-weight:800;font-size:2.3rem;line-height:1}
.d-price{font-family:var(--f-mono);font-size:12.5px}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-top:4px}
.tag.low{background:rgba(70,226,200,.16);color:var(--teal)}
.tag.busy{background:rgba(255,122,152,.16);color:var(--rose)}
.s-time{font-family:var(--f-display);font-weight:800;font-size:1.9rem;line-height:1}
.s-left{font-size:12.5px;color:var(--muted)}
.s-left.few{color:var(--rose)}
.meter{width:100%;height:3px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal)}
.meter i.few{background:var(--rose)}

/* people */
.people{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-size:16px}
.row .who small{color:var(--muted)}
.row .pp{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:20px;line-height:1}
.step button:hover:not(:disabled){border-color:var(--lamp);color:var(--lamp)}
.step button:disabled{opacity:.3;cursor:not-allowed}
.step output{width:30px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.7rem}

/* packs */
.pack{padding:16px 16px 18px;gap:6px}
.pack .p-name{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:1.9rem;line-height:1}
.pack .p-add{font-family:var(--f-mono);font-size:13px;color:var(--lamp)}
.pack ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
.pack .tag{margin:0 0 4px}
.extras{display:flex;flex-direction:column;gap:10px}
.extra{flex-direction:row;align-items:center;gap:14px;width:100%}
.extra .x-body{flex:1;min-width:0}
.extra .x-body b{display:block;font-size:15.5px}
.extra .x-body small{color:var(--muted)}
.check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center}
.extra[aria-pressed="true"] .check{background:var(--lamp);border-color:var(--lamp);color:var(--night)}

/* review */
.lines{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lines li{display:flex;justify-content:space-between;gap:16px;padding:11px 2px;border-bottom:1px solid var(--line)}
.lines li span:first-child{min-width:0}
.lines li small{display:block;color:var(--muted)}
.lines .sum{font-weight:700;font-size:18px;border-bottom:none}
.fine{color:var(--muted);font-size:12.5px;margin-top:10px}

/* ticket */
.ticket{display:flex;max-width:620px;margin:0 auto;border-radius:16px;overflow:hidden;background:#f6efe1;color:#1d1838;box-shadow:0 30px 80px -20px rgba(255,181,71,.5)}
.ticket .main{flex:1;padding:22px 24px;min-width:0}
.ticket .stub{width:150px;flex:none;border-left:2px dashed rgba(29,24,56,.25);padding:18px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.ticket .t-park{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:2rem;line-height:.95}
.ticket dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:14px}
.ticket dt{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.6;padding-top:2px}
.ticket dd{margin:0;font-weight:700}
.ticket .code{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em}
.done-actions{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}

/* HUD */
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none;z-index:3}
.brand{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:.03em;pointer-events:auto}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.14em;color:var(--muted)}
.rail{display:flex;flex-direction:column;gap:2px;pointer-events:auto}
.rail button{display:flex;align-items:center;justify-content:flex-end;gap:10px;background:none;border:0;padding:3px 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rail button i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.rail button.on{color:var(--lamp)}
.rail button.on i{background:var(--lamp);border-color:var(--lamp);box-shadow:0 0 10px var(--lamp)}
.rail button.past i{background:var(--muted)}
.rail button:disabled{opacity:.35;cursor:default}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:28px 18px calc(env(safe-area-inset-bottom,0px) + 16px);
  background:linear-gradient(180deg,rgba(13,11,34,0),rgba(13,11,34,.92) 45%);display:flex;align-items:center;gap:14px}
.bar .total{flex:1;min-width:0;text-align:center}
.bar .total .amt{font-family:var(--f-mono);font-weight:600;font-size:22px}
.bar .total small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:700;letter-spacing:.02em;white-space:nowrap;transition:transform .15s,opacity .15s}
.btn.primary{background:var(--lamp);color:var(--night);box-shadow:0 8px 30px -8px rgba(255,181,71,.7)}
.btn.primary:hover:not(:disabled){transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);text-align:center;font-size:12.5px;color:var(--rose);z-index:3;pointer-events:none}
.proto{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:middle}

@media (max-width:640px){
  .rail{flex-direction:row;gap:6px;margin-top:6px}
  .rail button span{display:none}
  .stage{max-height:calc(100dvh - 200px)}
  .ticket{flex-direction:column}
  .ticket .stub{width:auto;border-left:0;border-top:2px dashed rgba(29,24,56,.25);flex-direction:row}
  .bar{gap:8px}
  .btn{padding:12px 16px}
  .row{flex-wrap:wrap}
  .row .who{flex-basis:100%}
  .row .pp{flex:1}
}
@media (prefers-reduced-motion:reduce){ .tile,.btn{transition:none} }
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<div id="viewport"></div>

<header class="top">
  <div class="brand">Harbor Lights<span class="proto">Prototype</span><small>Adventure Park · Season 2026</small></div>
  <nav class="rail" id="rail" aria-label="Steps"></nav>
</header>
<div class="hint" id="hint" aria-live="polite"></div>
<footer class="bar">
  <button class="btn ghost" id="back">Back</button>
  <div class="total"><div class="amt" id="amt">€0.00</div><small id="sub">Nothing picked yet</small></div>
  <button class="btn primary" id="next">Continue</button>
</footer>

<script>
(() => {
const P = 1000;                 // perspective, px (must match CSS projection)
const D = 1500;                 // depth between gates, px
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const eur = n => new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(n);
const half = n => Math.round(n*2)/2;

const STAGES = [
  {key:'intro',  label:'Entrance'},
  {key:'date',   label:'Date'},
  {key:'slot',   label:'Arrival'},
  {key:'who',    label:'Tickets'},
  {key:'pack',   label:'Pack'},
  {key:'extras', label:'Extras'},
  {key:'review', label:'Review'},
  {key:'done',   label:'Your tickets'}
];
const GATES = 6; // numbered gates: date … review

// ---------- data (example data for the prototype) ----------
const today = new Date(); today.setHours(0,0,0,0);
const DATES = Array.from({length:10},(_,k)=>{
  const d = new Date(today); d.setDate(today.getDate()+k+1);
  const wk = d.getDay()===0 || d.getDay()===6;
  const price = half(25 + (wk?7:0) + ((d.getDate()*37)%9)*0.5);
  return {id:k, d, price, wk};
});
const minP = Math.min(...DATES.map(x=>x.price)), maxP = Math.max(...DATES.map(x=>x.price));
const SLOT_TIMES = ['10:00','10:30','11:00','11:30','12:00','13:00','14:00','15:30'];
const CAP = 120;
function slotsFor(dateId){
  const seed = DATES[dateId].d.getDate() + (DATES[dateId].wk?40:0);
  return SLOT_TIMES.map((t,i)=>{
    let left = (seed*17 + i*41) % 96;
    if (DATES[dateId].wk) left = Math.floor(left*0.45);
    if (left < 3) left = 0;
    return {t, left};
  });
}
const PEOPLE = [
  {k:'adult',  name:'Adult',   age:'Age 12–64', f:1},
  {k:'child',  name:'Child',   age:'Age 3–11',  f:0.7},
  {k:'senior', name:'Senior',  age:'Age 65+',   f:0.85},
  {k:'toddler',name:'Toddler', age:'Age 0–2, no ticket needed', f:0}
];
const PACKS = [
  {k:'entry',   name:'Day entry', add:0,    perks:['All rides and shows','Park map in the app']},
  {k:'explorer',name:'Explorer',  add:9.5,  perks:['Skip the queue on 3 rides','Reserved seat at the sea-lion show']},
  {k:'feast',   name:'Feast',     add:14,   perks:['Lunch at the Boathouse','One drink per person']},
  {k:'allin',   name:'All-in',    add:21,   perks:['Everything in Explorer + Feast','Night carousel ride'], tag:'Best value'}
];
const EXTRAS = [
  {k:'parking', name:'Parking, one car', note:'Gate P2, right by the entrance', price:9, per:'booking'},
  {k:'photos',  name:'All your ride photos', note:'Download after your visit, no watermark', price:14.95, per:'booking'},
  {k:'locker',  name:'All-day locker', note:'Fits two backpacks', price:6, per:'booking'},
  {k:'poncho',  name:'Splash poncho', note:'For the log flume. One per person', price:3.5, per:'person'}
];

const S = { date:null, slot:null, qty:{adult:2,child:0,senior:0,toddler:0}, pack:'entry', extras:new Set(), paid:null };

const priceFor = k => S.date==null ? DATES.reduce((m,x)=>Math.min(m,x.price),99)*PEOPLE.find(p=>p.k===k).f
                                   : half(DATES[S.date].price*PEOPLE.find(p=>p.k===k).f);
const paying = () => S.qty.adult + S.qty.child + S.qty.senior;
function lines(){
  const out = [];
  if (S.date==null) return out;
  const dl = fmtDate(DATES[S.date].d);
  PEOPLE.forEach(p=>{ if (S.qty[p.k] && p.f>0) out.push({l:`${S.qty[p.k]} × ${p.name}`, s:`${dl}${S.slot!=null?' · '+SLOT_TIMES[S.slot]:''}`, a:S.qty[p.k]*priceFor(p.k)}); });
  if (S.qty.toddler) out.push({l:`${S.qty.toddler} × Toddler`, s:'Free entry', a:0});
  const pk = PACKS.find(p=>p.k===S.pack);
  if (pk.add && paying()) out.push({l:`${pk.name} pack × ${paying()}`, s:pk.perks[0], a:pk.add*paying()});
  EXTRAS.forEach(x=>{ if (S.extras.has(x.k)){ const n = x.per==='person'?paying():1; out.push({l:`${x.name}${n>1?' × '+n:''}`, s:x.note, a:x.price*n}); }});
  return out;
}
const total = () => lines().reduce((s,l)=>s+l.a,0);
const fmtDate = d => d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});

const canLeave = i => STAGES[i].key==='date' ? S.date!=null
                    : STAGES[i].key==='slot' ? S.slot!=null
                    : STAGES[i].key==='who'  ? paying()>0 : true;
const whyNot = i => ({date:'Pick a date to continue', slot:'Pick an arrival time to continue', who:'Add at least one ticket'})[STAGES[i].key] || '';
function maxReach(){ if (S.paid) return 7; for (let i=0;i<6;i++) if (!canLeave(i)) return i; return 6; }

// ---------- stage renderers ----------
const head = (i, title, lede) => `<p class="eyebrow">Gate ${i} of ${GATES} · ${STAGES[i].label}</p><h2>${title}</h2>${lede?`<p class="lede">${lede}</p>`:''}`;
const R = {
  intro: () => `<div class="intro">
      <p class="eyebrow">Tickets · Season 2026</p>
      <h1>Walk in.<br><span>Pick as you go.</span></h1>
      <p>Move through the park gates one at a time. Choose your day, your arrival time, who's coming and how you want to spend it.</p>
      <button class="btn primary" data-act="next" data-fid="enter">Step inside →</button>
      <div class="hours">Open daily 10:00–18:00 · Night carousel Fri–Sat until 22:00</div>
    </div>`,
  date: () => head(1,'When are you coming?','Prices move with demand. Quieter days cost less.') +
    `<div class="grid dates">${DATES.map(x=>{
      const tag = x.price===minP ? '<span class="tag low">Lowest</span>' : x.price>=maxP-1 ? '<span class="tag busy">Busy</span>' : '';
      return `<button class="tile" data-act="date" data-v="${x.id}" data-fid="d${x.id}" aria-pressed="${S.date===x.id}">
        <span class="d-wd">${x.d.toLocaleDateString('en-GB',{weekday:'short'})} · ${x.d.toLocaleDateString('en-GB',{month:'short'})}</span>
        <span class="d-num">${x.d.getDate()}</span><span class="d-price">${eur(x.price)}</span>${tag}</button>`;}).join('')}</div>`,
  slot: () => {
    if (S.date==null) return head(2,'Pick your arrival time','Pick a date first.');
    const sl = slotsFor(S.date);
    return head(2,'Pick your arrival time',`${fmtDate(DATES[S.date].d)}. Arrive within 30 minutes of your slot; stay as long as you like.`) +
    `<div class="grid slots">${sl.map((s,i)=>{
      const few = s.left>0 && s.left<20, pct = Math.max(4, 100 - s.left/CAP*100);
      return `<button class="tile" data-act="slot" data-v="${i}" data-fid="s${i}" aria-pressed="${S.slot===i}" ${s.left?'':'disabled'}>
        <span class="s-time">${s.t}</span>
        <span class="s-left ${few?'few':''}">${s.left? (few?`Only ${s.left} left`:`${s.left} places left`) : 'Full'}</span>
        <span class="meter"><i class="${few?'few':''}" style="width:${pct}%"></i></span></button>`;}).join('')}</div>`;
  },
  who: () => head(3,"Who's coming?", S.date!=null?`Prices for ${fmtDate(DATES[S.date].d)}.`:'') +
    `<div class="people">${PEOPLE.map(p=>`<div class="row">
      <div class="who"><b>${p.name}</b><small>${p.age}</small></div>
      <span class="pp">${p.f? eur(priceFor(p.k)) : 'Free'}</span>
      <div class="step">
        <button data-act="dec" data-v="${p.k}" data-fid="m${p.k}" aria-label="One fewer ${p.name}" ${S.qty[p.k]?'':'disabled'}>−</button>
        <output aria-live="polite">${S.qty[p.k]}</output>
        <button data-act="inc" data-v="${p.k}" data-fid="p${p.k}" aria-label="One more ${p.name}" ${S.qty[p.k]>=10?'disabled':''}>+</button>
      </div></div>`).join('')}</div>`,
  pack: () => head(4,'Choose your pack', `Applies to all ${paying()||''} paying guests. Toddlers get the perks for free.`) +
    `<div class="grid packs">${PACKS.map(p=>`<button class="tile pack" data-act="pack" data-v="${p.k}" data-fid="k${p.k}" aria-pressed="${S.pack===p.k}">
      ${p.tag?`<span class="tag low">${p.tag}</span>`:''}
      <span class="p-name">${p.name}</span>
      <span class="p-add">${p.add?'+ '+eur(p.add)+' / person':'Included'}</span>
      <ul>${p.perks.map(x=>`<li>${x}</li>`).join('')}</ul></button>`).join('')}</div>`,
  extras: () => head(5,'Anything else?','Optional. Add these now and skip the queue at the kiosk.') +
    `<div class="extras">${EXTRAS.map(x=>`<button class="tile extra" data-act="extra" data-v="${x.k}" data-fid="x${x.k}" aria-pressed="${S.extras.has(x.k)}">
      <span class="check">${S.extras.has(x.k)?'✓':''}</span>
      <span class="x-body"><b>${x.name}</b><small>${x.note}</small></span>
      <span class="mono">${eur(x.price)}${x.per==='person'?' pp':''}</span></button>`).join('')}</div>`,
  review: () => {
    const ls = lines();
    return head(6,'Check and pay', ls.length?'Your price is held while you check out.':'Go back and pick a date first.') +
    `<ul class="lines">${ls.map(l=>`<li><span>${l.l}<small>${l.s}</small></span><span class="mono">${l.a?eur(l.a):'Free'}</span></li>`).join('')}
      <li class="sum"><span>Total</span><span class="mono">${eur(total())}</span></li></ul>
     <p class="fine">Includes 9% VAT. Tickets arrive by email as a PDF and in Apple Wallet or Google Wallet.</p>`;
  },
  done: () => {
    if (!S.paid) return '';
    const p = S.paid;
    return `<p class="eyebrow" style="text-align:center">Order ${p.code} · Prototype, no payment taken</p>
    <h2 style="text-align:center">You're in.</h2><p class="lede" style="text-align:center;margin-inline:auto">Show this at the gate. Every guest gets their own barcode in the email.</p>
    <div class="ticket">
      <div class="main"><div class="t-park">Harbor Lights</div>
        <dl><dt>Date</dt><dd>${p.date}</dd><dt>Arrive</dt><dd>${p.slot} – ${p.until}</dd><dt>Guests</dt><dd>${p.guests}</dd><dt>Pack</dt><dd>${p.pack}</dd>${p.extras?`<dt>Extras</dt><dd>${p.extras}</dd>`:''}</dl>
      </div>
      <div class="stub">${barcode(p.code)}<span class="code">${p.code}</span></div>
    </div>
    <div class="done-actions"><button class="btn ghost" data-act="restart" data-fid="restart">Start over</button></div>`;
  }
};

function barcode(seed){
  let h = 0; for (const c of seed) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h*1664525 + 1013904223) >>> 0) / 4294967296;
  let x = 0, bars = '';
  while (x < 116){ const w = 1 + Math.floor(rnd()*3); if (rnd() > .4) bars += `<rect x="${x}" y="0" width="${w}" height="60" fill="#1d1838"/>`; x += w + 1; }
  return `<svg viewBox="0 0 118 60" width="118" height="60" role="img" aria-label="Barcode">${bars}</svg>`;
}

// ---------- build world ----------
const world = document.getElementById('viewport');
const els = STAGES.map((s,i)=>{
  const el = document.createElement('section');
  el.className = 'stage'; el.dataset.i = i; el.setAttribute('aria-label', s.label);
  world.appendChild(el); return el;
});
function render(which){
  const fid = document.activeElement?.dataset?.fid;
  (which || STAGES.map((_,i)=>i)).forEach(i=> els[i].innerHTML = R[STAGES[i].key]());
  if (fid){ const f = document.querySelector(`[data-fid="${fid}"]`); if (f && !f.disabled) f.focus({preventScroll:true}); }
  hud();
}

// ---------- camera ----------
let cur = 0, cam = 0, anim = null, vel = 0;
function goTo(i){
  i = Math.max(0, Math.min(i, maxReach()));
  if (i === cur) return;
  cur = i;
  const from = cam, dist = Math.abs(i-from);
  anim = reduce ? null : {from, to:i, t0:performance.now(), dur:Math.min(2300, 950 + 320*dist)};
  if (reduce) cam = i;
  hud();
  setTimeout(()=>{ const f = els[i].querySelector('button:not(:disabled)'); if (f && document.activeElement?.closest?.('.stage')) f.focus({preventScroll:true}); }, reduce?0:anim.dur*0.8);
}
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;

function layoutStages(){
  els.forEach((el,i)=>{
    const d = i - cam;   // >0 ahead, <0 passed
    let o = d >= 0 ? Math.max(0, 1 - d*0.62) : Math.max(0, 1 + d/0.22);
    if (STAGES[i].key==='done' && !S.paid) o = 0;
    const live = Math.abs(d) < 0.02 && i === cur;
    el.style.opacity = o.toFixed(3);
    el.style.visibility = (o < 0.01 || d < -0.5) ? 'hidden' : 'visible';
    el.style.pointerEvents = live ? 'auto' : 'none';
    el.style.transform = Math.abs(d) < 0.001 ? 'translate(-50%,-50%)' : `translate(-50%,-50%) translateZ(${(-d*D).toFixed(1)}px)`;
    el.inert = !live;
    el.setAttribute('aria-hidden', live ? 'false' : 'true');
  });
}

// ---------- HUD ----------
const rail = document.getElementById('rail'), nextB = document.getElementById('next'), backB = document.getElementById('back');
const amt = document.getElementById('amt'), sub = document.getElementById('sub'), hint = document.getElementById('hint');
function hud(){
  const mr = maxReach();
  rail.innerHTML = STAGES.map((s,i)=> (s.key==='done' && !S.paid) ? '' :
    `<button class="${i===cur?'on':i<cur?'past':''}" data-go="${i}" ${i>mr?'disabled':''} aria-current="${i===cur?'step':'false'}" aria-label="${s.label}"><span>${s.label}</span><i></i></button>`).join('');
  const t = total(), n = paying() + S.qty.toddler;
  amt.textContent = eur(t);
  const bits = [];
  if (S.date!=null) bits.push(fmtDate(DATES[S.date].d)); if (S.slot!=null) bits.push(SLOT_TIMES[S.slot]);
  if (n) bits.push(`${n} guest${n>1?'s':''}`);
  sub.textContent = bits.length ? bits.join(' · ') : 'Nothing picked yet';
  const key = STAGES[cur].key;
  backB.disabled = cur === 0 || key==='done';
  backB.hidden = key==='intro';
  nextB.hidden = key==='done';
  nextB.textContent = key==='intro' ? 'Step inside' : key==='review' ? `Pay ${eur(t)}` : key==='extras' ? 'Review order' : 'Continue';
  nextB.disabled = !canLeave(cur) || (key==='review' && !t);
  hint.textContent = canLeave(cur) ? '' : whyNot(cur);
}

function next(){
  if (!canLeave(cur)) return;
  if (STAGES[cur].key==='review'){ pay(); return; }
  goTo(cur+1);
}
function pay(){
  const sl = SLOT_TIMES[S.slot], [h,m] = sl.split(':').map(Number), u = new Date(0,0,0,h,m+30);
  const PL = {adult:'adults',child:'children',senior:'seniors',toddler:'toddlers'};
  const g = PEOPLE.filter(p=>S.qty[p.k]).map(p=> S.qty[p.k]===1 ? `1 ${p.name.toLowerCase()}` : `${S.qty[p.k]} ${PL[p.k]}`).join(', ');
  S.paid = {
    code: 'HL-' + String(Math.floor(100000 + Math.random()*900000)),
    date: DATES[S.date].d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}),
    slot: sl, until: `${String(u.getHours()).padStart(2,'0')}:${String(u.getMinutes()).padStart(2,'0')}`,
    guests: g,
    pack: PACKS.find(p=>p.k===S.pack).name,
    extras: EXTRAS.filter(x=>S.extras.has(x.k)).map(x=>x.name).join(', ')
  };
  burst = 1;
  render([7]); goTo(7);
}

document.addEventListener('click', e=>{
  const g = e.target.closest('[data-go]'); if (g){ goTo(+g.dataset.go); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act){
    case 'next': next(); return;
    case 'date': S.date = +v; S.slot = null; render([1,2,3,6]); return;
    case 'slot': S.slot = +v; render([2,6]); return;
    case 'inc': S.qty[v] = Math.min(10, S.qty[v]+1); render([3,4,6]); return;
    case 'dec': S.qty[v] = Math.max(0, S.qty[v]-1); render([3,4,6]); return;
    case 'pack': S.pack = v; render([4,6]); return;
    case 'extra': S.extras.has(v) ? S.extras.delete(v) : S.extras.add(v); render([5,6]); return;
    case 'restart':
      Object.assign(S,{date:null,slot:null,qty:{adult:2,child:0,senior:0,toddler:0},pack:'entry',extras:new Set(),paid:null});
      anim = reduce?null:{from:cam,to:0,t0:performance.now(),dur:2000}; cur = 0; if (reduce) cam = 0; render(); return;
  }
});
nextB.addEventListener('click', next);
backB.addEventListener('click', ()=> goTo(cur-1));

// wheel / keys / swipe = move along the Z axis
let wAcc = 0, wT = 0;
addEventListener('wheel', e=>{
  const st = e.target.closest?.('.stage');
  if (st && st.scrollHeight > st.clientHeight + 2){
    const atTop = st.scrollTop <= 0, atEnd = st.scrollTop + st.clientHeight >= st.scrollHeight - 2;
    if (!((e.deltaY > 0 && atEnd) || (e.deltaY < 0 && atTop))) return;
  }
  if (anim) return;
  wAcc += e.deltaY; clearTimeout(wT); wT = setTimeout(()=> wAcc = 0, 180);
  if (wAcc > 90){ wAcc = 0; if (STAGES[cur].key!=='review') next(); }
  else if (wAcc < -90){ wAcc = 0; if (STAGES[cur].key!=='done') goTo(cur-1); }
}, {passive:true});
addEventListener('keydown', e=>{
  if (e.key==='ArrowDown' || e.key==='PageDown'){ e.preventDefault(); if (STAGES[cur].key!=='review') next(); }
  if (e.key==='ArrowUp' || e.key==='PageUp'){ e.preventDefault(); if (STAGES[cur].key!=='done') goTo(cur-1); }
});

// mouse parallax: shift the vanishing point
let mx = 0, my = 0, ox = 0, oy = 0;
addEventListener('pointermove', e=>{ if (e.pointerType!=='mouse') return; mx = (e.clientX/innerWidth - .5); my = (e.clientY/innerHeight - .5); });
const vp = document.getElementById('viewport');
vp.style.perspective = P + 'px';

// ---------- canvas tunnel ----------
const cv = document.getElementById('fx'), cx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
function size(){ dpr = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0); }
size(); addEventListener('resize', size);

const ZMAX = -(STAGES.length+1)*D;
const parts = Array.from({length: 360}, ()=>({
  x:(Math.random()-.5)*4200, y:(Math.random()-.5)*2400, z: P*0.8 + Math.random()*(ZMAX - P*0.8),
  c: Math.random()<.55 ? '255,181,71' : Math.random()<.6 ? '70,226,200' : '243,239,253', r: .6 + Math.random()*1.6
}));
let burst = 0;

function proj(x,y,z){
  const rel = z + cam*D;
  if (rel >= P*0.92) return null;
  const s = P/(P-rel), vx = W/2 + ox, vy = H/2 - 30 + oy;
  return {x: vx + (W/2 + x - vx)*s, y: vy + (H/2 - 30 + y - vy)*s, s};
}

function draw(t){
  // camera
  if (anim){
    const k = Math.min(1, (t - anim.t0)/anim.dur), prev = cam;
    cam = anim.from + (anim.to - anim.from)*ease(k);
    vel = (cam - prev)*D;
    if (k >= 1){ anim = null; cam = cur; vel = 0; }
  } else vel *= 0.85;
  ox += (mx*-90 - ox)*0.06; oy += (my*-60 - oy)*0.06;
  vp.style.perspectiveOrigin = `calc(50% + ${ox.toFixed(1)}px) calc(50% - 30px + ${oy.toFixed(1)}px)`;
  layoutStages();

  // sky
  const vx = W/2 + ox, vy = H/2 - 30 + oy;
  cx.fillStyle = '#0d0b22'; cx.fillRect(0,0,W,H);
  const g = cx.createRadialGradient(vx,vy,0,vx,vy,Math.max(W,H)*.7);
  g.addColorStop(0,'rgba(255,181,71,0.16)'); g.addColorStop(.35,'rgba(60,40,120,0.18)'); g.addColorStop(1,'rgba(13,11,34,0)');
  cx.fillStyle = g; cx.fillRect(0,0,W,H);

  // floor grid
  const fy = Math.min(H*0.55, 520);
  cx.lineWidth = 1;
  for (let z = Math.ceil((P*0.85 - cam*D)/260)*260; z > ZMAX; z -= 260){
    const a = proj(-3600, fy, z), b = proj(3600, fy, z); if (!a) continue;
    const al = Math.min(.22, .5*a.s);
    cx.strokeStyle = `rgba(120,100,220,${al})`; cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke();
  }
  const near = P*0.85 - cam*D;
  for (let x = -3600; x <= 3600; x += 300){
    const a = proj(x, fy, near), b = proj(x, fy, ZMAX);
    cx.strokeStyle = 'rgba(120,100,220,0.14)'; cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke();
  }

  // portals with string lights, one per gate
  const pw = Math.min(W-32, 860)/2 + 70, ph = Math.min(H*0.5, 380);
  for (let i = STAGES.length-1; i >= 1; i--){
    if (STAGES[i].key==='done' && !S.paid) continue;
    const z = -i*D + D*0.18, d = i - cam;
    if (d < -0.1) continue;
    const tl = proj(-pw, -ph, z), br = proj(pw, fy, z); if (!tl) continue;
    const fade = Math.max(0, Math.min(1, 1.15 - d*0.22)) * Math.min(1, (d+0.1)*3);
    const w = br.x - tl.x, top = tl.y, bot = br.y, l = tl.x, r = br.x;
    // arch
    cx.strokeStyle = `rgba(255,181,71,${0.35*fade})`; cx.lineWidth = Math.max(1, 3*tl.s);
    cx.beginPath(); cx.moveTo(l,bot); cx.lineTo(l,top + w*0.12); cx.quadraticCurveTo(l + w/2, top - w*0.12, r, top + w*0.12); cx.lineTo(r,bot); cx.stroke();
    // bulbs
    const n = 26;
    for (let k = 0; k <= n; k++){
      const u = k/n, px = l + w*u, py = (1-u)*(1-u)*(top+w*0.12) + 2*(1-u)*u*(top-w*0.12) + u*u*(top+w*0.12);
      const tw = 0.55 + 0.45*Math.sin(t/380 + k*1.7 + i);
      cx.fillStyle = `rgba(255,${190+((k%3)*20)},${100+((k%2)*60)},${fade*tw})`;
      cx.beginPath(); cx.arc(px, py, Math.max(1, 3.2*tl.s), 0, 6.283); cx.fill();
    }
    for (let k = 1; k < 7; k++){ const py = top + w*0.12 + (bot - top - w*0.12)*k/7, tw = .5+.5*Math.sin(t/300+k+i);
      cx.fillStyle = `rgba(70,226,200,${fade*tw*.8})`;
      [l,r].forEach(px=>{ cx.beginPath(); cx.arc(px, py, Math.max(1, 2.6*tl.s), 0, 6.283); cx.fill(); }); }
    // gate number
    if (i <= GATES && d > 0.3){
      cx.fillStyle = `rgba(255,181,71,${0.5*fade})`; cx.font = `800 ${Math.max(10, 46*tl.s)}px "Big Shoulders Display", Impact, sans-serif`;
      cx.textAlign = 'center'; cx.fillText(String(i).padStart(2,'0'), l + w/2, top - 6*tl.s);
    }
  }

  // drifting lights, stretched into streaks by speed
  const speed = Math.abs(vel) + burst*120;
  burst *= 0.96;
  for (const p of parts){
    if (!reduce) p.z += 0.4;
    if (p.z + cam*D > P*0.9) p.z -= (P*0.9 - ZMAX);
    const a = proj(p.x, p.y, p.z); if (!a) continue;
    const al = Math.min(1, a.s*0.9);
    if (speed > 4){
      const b = proj(p.x, p.y, p.z - speed*2.2) || a;
      cx.strokeStyle = `rgba(${p.c},${al*0.8})`; cx.lineWidth = Math.max(.6, p.r*a.s);
      cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke();
    } else {
      cx.fillStyle = `rgba(${p.c},${al})`; cx.beginPath(); cx.arc(a.x,a.y, Math.max(.5, p.r*a.s), 0, 6.283); cx.fill();
    }
  }
  requestAnimationFrame(draw);
}

render();
requestAnimationFrame(draw);
})();
</script>

</body>
</html>
